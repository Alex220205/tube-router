# Serves the built single-page application.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so these can be cached indefinitely: a changed file
    # gets a different name rather than a new version of the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any path the router owns has to return index.html rather than 404,
    # because the routes exist only in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
