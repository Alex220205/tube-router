# uv workspace root.
#
# This file defines no project of its own. It exists to tie `engine/` and
# `backend/` into one workspace with a single lockfile, and to hold the
# tool configuration that applies across both.
#
# See docs/DECISIONS.md, "One uv workspace at the root, two members".

[tool.uv.workspace]
members = ["backend", "engine"]

# Repo-wide tooling, attached to the workspace rather than to either member,
# because linting and type checking are not the backend's concern or the
# engine's.
[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.11",
]

# --- ruff: lint + format, replacing black, flake8 and isort ------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.isort]
# Without this, isort files `app` and `tube_engine` under third-party and
# sorts them in among httpx and sqlalchemy.
known-first-party = ["app", "tube_engine"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

# --- mypy: strict, engine only ----------------------------------------------
# Deliberately scoped. The engine is pure Python with no framework types to
# fight, so strictness is cheap there and load-bearing. Extending it across
# the backend turns it into a chore that eventually gets switched off.
# See docs/DECISIONS.md.
[tool.mypy]
python_version = "3.12"
files = ["engine/tube_engine"]
strict = true
