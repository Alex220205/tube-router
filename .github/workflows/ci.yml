# Runs on every pull request and every push to main.
#
# Three independent jobs so a frontend failure does not hide a backend one,
# and so the secret scan reports on its own rather than as a line in a lint
# log.
#
# The engine job runs with no database and no services, which is the point:
# if engine tests ever need one, something has gone wrong in engine/.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch. Pushing a fix should not queue
# behind the run for the commit it fixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python - lint, types, tests
    runs-on: ubuntu-latest

    # The schema tests assert what Postgres rejects, which cannot be faked
    # with a stub the way the /health tests fake a session. They need a real
    # server with PostGIS, so CI runs one.
    #
    # The engine job needs nothing and gets nothing - if engine tests ever
    # require a database, something has gone wrong in engine/.
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tube
          POSTGRES_PASSWORD: tube
          POSTGRES_DB: tube_router_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tube -d tube_router_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Phase 7. Only the pub/sub test needs this, and it skips without
      # TEST_REDIS_URL below - a test that skips everywhere is worse than no
      # test, so CI is where it is guaranteed to run.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: fail if the lockfile disagrees with the manifests rather
      # than resolving something new, so CI tests the versions that were
      # committed.
      - name: Install
        run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Scoped to engine/ by configuration in the root pyproject.toml.
      - name: Type check
        run: uv run mypy

      - name: Engine tests
        working-directory: engine
        run: uv run pytest

      - name: Backend tests
        working-directory: backend
        env:
          # Set explicitly so the schema tests RUN here. They skip when this
          # is unset, which is right on a laptop with nothing started and
          # wrong in CI - a silently skipped constraint test is worse than no
          # test, because the build still goes green.
          TEST_DATABASE_URL: postgresql+asyncpg://tube:tube@localhost:5432/tube_router_test
          # Set for the same reason, and with the same consequence: the
          # WebSocket pub/sub test skips without it, so this is what stops it
          # being a test that has never run anywhere.
          TEST_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest

  frontend:
    name: Frontend - lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Not a formality, and not covered by the two steps above. npm test and
      # the dev server resolve modules differently from the production build,
      # so a hand-written mock can assert an interface that does not exist and
      # the suite will agree with it.
      #
      # Phase 8a is the worked example: maplibre-gl v6 has no default export,
      # the mock invented one, eleven tests passed, and only the build failed.
      # This is also the command the production Dockerfile runs, so without it
      # a dependency that breaks the container is found at deploy time.
      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. Scanning only the latest commit would miss a key
          # added and then deleted, which is exactly the case that matters:
          # making a repository public exposes every commit ever made to it.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
