[project]
name = "tube-router-backend"
version = "0.1.0"
description = "Web service for Tube Router: HTTP, Postgres, Redis. Not the routing logic."
requires-python = ">=3.12"

# Dependencies get added in the phase that uses them, not in advance. Phase 1
# brings alembic and geoalchemy2 with the schema; the Redis client arrives in
# Phase 6 and httpx in Phase 7.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Schema history in version control. Phase 1.
    "alembic>=1.14",
    # PostGIS column types for SQLAlchemy - geography(Point, 4326) has no
    # equivalent in core SQLAlchemy. Phase 1.
    "geoalchemy2>=0.16",
    # Async HTTP, for talking to TfL. Phase 2 seeds from it; Phase 7 polls it.
    # Async specifically: `requests` would block the event loop for every
    # connected user while waiting on someone else's server.
    "httpx>=0.27",
    # Caches the built routing graph and, from Phase 7, live line status.
    "redis>=5",
    "tube-engine",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # conftest reads TEST_DATABASE_URL out of the repo-root .env so that
    # `cp .env.example .env` is the whole setup. Declared explicitly rather
    # than leaned on as a transitive dependency of pydantic-settings.
    "python-dotenv>=1.0",
]

# The engine is consumed from the workspace rather than from PyPI, so edits to
# it are picked up without reinstalling.
[tool.uv.sources]
tube-engine = { workspace = true }

# An application, not a library. Nothing installs it; uvicorn runs it.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test in this suite is async; declaring it here avoids decorating each
# one with @pytest.mark.asyncio.
asyncio_mode = "auto"
# Makes `app` importable when pytest runs from backend/.
pythonpath = ["."]
