[project]
name = "tube-router-backend"
version = "0.1.0"
description = "Web service for Tube Router: HTTP, Postgres, Redis. Not the routing logic."
requires-python = ">=3.12"

# Phase 0 needs exactly enough to serve /health and prove it can reach
# Postgres. Alembic and GeoAlchemy2 arrive in Phase 1 with the schema, the
# Redis client and httpx in Phases 6 and 7. Dependencies get added in the
# phase that uses them, not in advance.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tube-engine",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# The engine is consumed from the workspace rather than from PyPI, so edits to
# it are picked up without reinstalling.
[tool.uv.sources]
tube-engine = { workspace = true }

# An application, not a library. Nothing installs it; uvicorn runs it.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
